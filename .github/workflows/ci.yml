name: CI

# Runs only when it is worth its minutes: called by the release workflow before a release
# is published (a pushed vX.Y.Z tag), started by hand (Actions > CI > Run workflow, on any
# branch), or on a pull request from a fork (an outside contribution). Pushes to branches
# and Dependabot's pull requests run nothing: the full suite runs locally before a merge.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv run --locked ruff check src tests scripts

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    # Without the DJI Thermal SDK (not redistributable) the native comparisons skip; the
    # rest, including the built-in tables against the SDK's recorded digests, runs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.14"]
        resolution: [locked]
        include:
          # the oldest supported Python with the lowest dependency versions (numpy 1.26.2 and
          # Pillow 11.3.0, the versions WebODM runs it with)
          - os: ubuntu-latest
            python: "3.9"
            resolution: lowest-direct
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - if: matrix.resolution == 'locked'
        run: uv run --locked pytest -q
      - if: matrix.resolution == 'lowest-direct'
        run: uv run --resolution lowest-direct pytest -q

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv build --no-sources
      - run: uv run --no-project python scripts/check_dist.py dist
      - run: uvx twine@7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-dist                  # not the release workflow's dist, when it calls this
          path: dist/
          if-no-files-found: error

  smoke:
    # the built wheel, installed into a clean environment on every system
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-dist
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install the wheel and run its CLI and API
        shell: bash
        run: |
          wheel=$(ls dist/*.whl)
          for py in 3.9 3.14; do
            uvx --python $py --from "$wheel" dji-thermal-cli --version
            uvx --python $py --from "$wheel" dji-thermal-cli --help > /dev/null
            uv run --python $py --no-project --with "$wheel" python -c "import dji_thermal_cli as dtc; print(dtc.__version__, len(dtc.PALETTES))"
          done
