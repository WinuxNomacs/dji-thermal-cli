name: Release

# Push a tag vX.Y.Z matching pyproject.toml's version. CI runs first (ci.yml: lint, the
# tests on Linux, Windows and macOS, the build and its smoke test); then the build is
# published to TestPyPI, then to PyPI. Only the maintainer can push v* tags (a tag rule).
# Publishing uses Trusted Publishing (OIDC, no API tokens) and uploads digital attestations
# (PEP 740).

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  UV_VERSION: "0.12.5"

jobs:
  # First, so a mistyped tag costs seconds, not the CI matrix
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match version $version"; exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false              # no cache can influence a release build
      - run: uv build --no-sources
      - run: uv run --no-project python scripts/check_dist.py dist
      - run: uvx twine@7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/dji-thermal-cli/
    permissions:
      id-token: write                      # Trusted Publishing only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi                           # deploys from v* tags only
      url: https://pypi.org/project/dji-thermal-cli/
    permissions:
      id-token: write                      # Trusted Publishing only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
